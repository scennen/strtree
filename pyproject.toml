[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strtree"
version = "0.1.0"
description = "CLI tool that generates project structures from tree, JSON, or YAML specs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]

dependencies = []

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.3"
]

dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "build>=1.5.0",
    "twine>=7.0.0"
]

[project.scripts]
strtree = "strtree.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["strtree", "strtree.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"